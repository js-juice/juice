<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Component Docs</title>
        <link rel="stylesheet" href="../../../brand/templates/css/default.css" />
        <link rel="stylesheet" href="../../../brand/templates/css/juice.css" />
        <link rel="stylesheet" href="../../../brand/templates/css/pages.css" />
        <link href="https://fonts.cdnfonts.com/css/cubano" rel="stylesheet" />
        <script type="module" src="../../juice-forms-setup.mjs"></script>
        <script type="module" src="../../juice-forms.mjs"></script>
        <style>
            .docs-grid {
                display: grid;
                gap: 1rem;
            }

            .doc-controls {
                display: grid;
                grid-template-columns: 1fr auto auto;
                gap: 0.75rem;
                align-items: end;
            }

            .doc-controls label {
                display: grid;
                gap: 0.3rem;
                font-size: 0.9rem;
            }

            .doc-controls input,
            .doc-controls select,
            .doc-controls button {
                min-height: 2.25rem;
            }

            .doc-kv {
                display: grid;
                gap: 0.35rem;
                font-size: 0.95rem;
                color: #444;
            }

            .doc-table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 0.5rem;
            }

            .doc-table th,
            .doc-table td {
                border: 1px solid #d7d7d7;
                padding: 0.45rem 0.55rem;
                text-align: left;
                vertical-align: top;
                font-size: 0.92rem;
            }

            .doc-table th {
                background: #f5f5f5;
                font-weight: 600;
            }

            .chip-list {
                display: flex;
                gap: 0.4rem;
                flex-wrap: wrap;
                margin-top: 0.4rem;
            }

            .chip {
                border: 1px solid #d6d6d6;
                background: #fbfbfb;
                border-radius: 999px;
                padding: 0.2rem 0.6rem;
                font-size: 0.82rem;
            }

            .code-block {
                background: #111;
                color: #eaeaea;
                border-radius: 8px;
                padding: 0.8rem;
                overflow-x: auto;
                margin-top: 0.5rem;
            }

            .example-preview {
                border: 1px solid #d7d7d7;
                border-radius: 8px;
                padding: 0.75rem;
                margin-top: 0.5rem;
                background: #fff;
            }

            .muted {
                color: #666;
                font-size: 0.92rem;
            }
        </style>
    </head>

    <body class="docs-page docs-page--forms" data-default-component="form-info" data-components-root="../../components"
        data-default-manifest="../../components/component-manifest.json">
        <header>
            <div class="container flex-h flex-grow" style="flex:0 1 auto;">
                <div class="branding">
                    <a href="">
                        <img src="../../../brand/logo-long.svg" alt="JS Juice" />
                    </a>
                </div>
                <div data-include="../../../brand/templates/includes/nav.html" data-nav-base="../../../">
                </div>
            </div>
        </header>
        <main>
            <div id="hero" class="container padding:1o5">
                <h1 id="page-title">Component Documentation</h1>
                <p id="page-subtitle">Source-first AUTODOC/JSDoc renderer with manifest fallback.</p>
            </div>

            <div class="container padding:1o5">
                <div id="content" class="docs-grid">
                    <section class="card">
                        <h3>Load Docs</h3>
                        <div class="doc-controls">
                            <label for="component-input">
                                Component tag
                                <input id="component-input" list="component-list"
                                    placeholder="input-text or form-info" />
                                <datalist id="component-list"></datalist>
                            </label>
                            <button id="load-doc-button" type="button">Load</button>
                            <button id="copy-link-button" type="button">Copy Link</button>
                        </div>
                        <p id="doc-source" class="muted" aria-live="polite"></p>
                    </section>

                    <section class="card">
                        <h3>Overview</h3>
                        <div id="doc-overview"></div>
                    </section>

                    <section class="card">
                        <h3>Features</h3>
                        <ul id="doc-features"></ul>
                    </section>

                    <section class="card">
                        <h3>Example</h3>
                        <pre class="code-block"><code id="doc-example-code" class="language-js"></code></pre>
                        <div id="doc-example-preview" class="example-preview"></div>
                    </section>

                    <section class="card">
                        <h3>Attributes</h3>
                        <div id="doc-attributes"></div>
                    </section>

                    <section class="card">
                        <h3>Properties</h3>
                        <div id="doc-properties"></div>
                    </section>

                    <section class="card">
                        <h3>CSS Variables</h3>
                        <div id="doc-css-variables"></div>
                    </section>

                    <section class="card">
                        <h3>Part Names</h3>
                        <div id="doc-parts"></div>
                    </section>

                    <section class="card">
                        <h3>Public Methods</h3>
                        <div id="doc-public-methods"></div>
                    </section>

                    <section class="card">
                        <h3>Private Methods</h3>
                        <div id="doc-private-methods"></div>
                    </section>
                </div>
            </div>
        </main>
        <footer>
            <div class="container" style="flex:0 1 auto;">
                <div class="block margin:auto w:120px text-center">
                    <a href="" class="inline-block">
                        <img class="inline-block" src="../../../brand/logo-long-lt.svg" alt="JS Juice" height="40" />
                    </a>
                </div>
                <div class="copyright text-center">
                    <p>&copy; 2024 JS Juice. All rights reserved.</p>
                </div>
            </div>
        </footer>
        <script type="module" src="./component-doc-template.mjs"></script>
        <script type="module" src="../../../brand/templates/includes/include.mjs"></script>
    </body>

</html>
