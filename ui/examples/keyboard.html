<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>UI Keyboard Example</title>
        <link rel="stylesheet" href="../../brand/templates/css/default.css" />
        <link rel="stylesheet" href="../../brand/templates/css/juice.css" />
        <link rel="stylesheet" href="../../brand/templates/css/pages.css" />
        <link href="https://fonts.cdnfonts.com/css/cubano" rel="stylesheet" />
        <style>
            .layout {
                max-width: 980px;
                margin: 0 auto;
                display: grid;
                gap: 1rem;
            }

            .grid {
                display: grid;
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            @media (min-width: 760px) {
                .grid {
                    grid-template-columns: 1fr 1fr;
                }
            }

            .card {
                background: #fff;
                border: 1px solid #d7dce5;
                border-radius: 12px;
                padding: 1rem;
            }

            .hint {
                color: #5c6170;
                margin-top: 0;
            }

            .nav-back {
                font-size: 0.9rem;
            }
        </style>
    </head>

    <body class="docs-page docs-page--forms">
        <header>
            <div class="container flex-h flex-grow" style="flex:0 1 auto;">
                <div class="branding">
                    <a href="">
                        <img src="../../brand/logo-long.svg" alt="JS Juice" />
                    </a>
                </div>
                <div data-include="../../brand/templates/includes/nav.html" data-nav-base="../../"></div>
            </div>
        </header>
        <main>
            <div id="hero" class="container padding:1o5">
                <h1 id="page-title">Keyboard Components</h1>
                <p>Demo page for `ui-key` and `ui-key-group` layouts.</p>
            </div>
            <div class="container padding:1o5">
                <div id="content" class="layout">
                    <p class="nav-back"><a href="./index.html">Back to UI examples</a></p>
                    <section class="grid">
                        <article class="card">
                            <h2>WASD</h2>
                            <p class="hint">Common movement layout.</p>
                            <ui-key-group layout="wasd"></ui-key-group>
                        </article>
                        <article class="card">
                            <h2>Arrows</h2>
                            <p class="hint">Arrow-key cluster layout.</p>
                            <ui-key-group layout="arrows"></ui-key-group>
                        </article>
                    </section>
                </div>
            </div>
        </main>

        <script type="module" src="./register.mjs"></script>
        <script type="module" src="../../brand/templates/includes/include.mjs"></script>
    </body>

</html>
