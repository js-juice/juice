<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>UI Progress Example</title>
        <link rel="stylesheet" href="../../brand/templates/css/default.css" />
        <link rel="stylesheet" href="../../brand/templates/css/juice.css" />
        <link rel="stylesheet" href="../../brand/templates/css/pages.css" />
        <link href="https://fonts.cdnfonts.com/css/cubano" rel="stylesheet" />
        <style>
            .layout {
                max-width: 980px;
                margin: 0 auto;
                display: grid;
                gap: 1rem;
            }

            .card {
                background: #fff;
                border: 1px solid #d7dce5;
                border-radius: 12px;
                padding: 1rem;
            }

            .hint {
                color: #5c6170;
                margin-top: 0;
            }

            .controls {
                margin-top: 1rem;
                display: grid;
                gap: 0.5rem;
            }

            .nav-back {
                font-size: 0.9rem;
            }
        </style>
    </head>

    <body class="docs-page docs-page--forms">
        <header>
            <div class="container flex-h flex-grow" style="flex:0 1 auto;">
                <div class="branding">
                    <a href="">
                        <img src="../../brand/logo-long.svg" alt="JS Juice" />
                    </a>
                </div>
                <div data-include="../../brand/templates/includes/nav.html" data-nav-base="../../"></div>
            </div>
        </header>
        <main>
            <div id="hero" class="container padding:1o5">
                <h1 id="page-title">Progress Components</h1>
                <p>Demo page for `ui-progress`.</p>
            </div>
            <div class="container padding:1o5">
                <div id="content" class="layout">
                    <p class="nav-back"><a href="./index.html">Back to UI examples</a></p>
                    <article class="card">
                        <h2>Progress Demo</h2>
                        <p class="hint">Adjust the slider to update progress value and fill width.</p>
                        <ui-progress id="demo-progress" label="Build Pipeline" value="35" max="100" height="14"></ui-progress>
                        <div class="controls">
                            <label for="progress-value">Value</label>
                            <input id="progress-value" type="range" min="0" max="100" value="35" />
                        </div>
                    </article>
                </div>
            </div>
        </main>

        <script type="module" src="./register.mjs"></script>
        <script type="module">
            const progress = document.getElementById("demo-progress");
            const valueInput = document.getElementById("progress-value");
            valueInput.addEventListener("input", () => {
                progress.setAttribute("value", valueInput.value);
            });
        </script>
        <script type="module" src="../../brand/templates/includes/include.mjs"></script>
    </body>

</html>
