<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>UI Expandable List Example</title>
        <link rel="stylesheet" href="../../brand/templates/css/default.css" />
        <link rel="stylesheet" href="../../brand/templates/css/juice.css" />
        <link rel="stylesheet" href="../../brand/templates/css/pages.css" />
        <link href="https://fonts.cdnfonts.com/css/cubano" rel="stylesheet" />
        <style>
            .layout {
                max-width: 980px;
                margin: 0 auto;
                display: grid;
                gap: 1rem;
            }

            .card {
                background: #fff;
                border: 1px solid #d7dce5;
                border-radius: 12px;
                padding: 1rem;
            }

            .hint {
                color: #5c6170;
                margin-top: 0;
            }

            .nav-back {
                font-size: 0.9rem;
            }

            expandable-list {
                display: block;
                border: 1px solid #d7dce5;
                border-radius: 10px;
                padding: 0.85rem;
                background: #fbfcff;
            }

            .controls {
                margin-top: 1rem;
                display: flex;
                gap: 0.6rem;
            }
        </style>
    </head>

    <body class="docs-page docs-page--forms">
        <header>
            <div class="container flex-h flex-grow" style="flex:0 1 auto;">
                <div class="branding">
                    <a href="">
                        <img src="../../brand/logo-long.svg" alt="JS Juice" />
                    </a>
                </div>
                <div data-include="../../brand/templates/includes/nav.html" data-nav-base="../../"></div>
            </div>
        </header>
        <main>
            <div id="hero" class="container padding:1o5">
                <h1 id="page-title">Expandable List</h1>
                <p>Expandable tree view for object and array data.</p>
            </div>
            <div class="container padding:1o5">
                <div id="content" class="layout">
                    <p class="nav-back"><a href="./index.html">Back to UI examples</a></p>
                    <article class="card">
                        <h2>Demo</h2>
                        <p class="hint">Use +/- buttons to open and close branches.</p>
                        <expandable-list id="config-tree"></expandable-list>
                        <div class="controls">
                            <button type="button" id="collapse-all">Collapse Default</button>
                            <button type="button" id="expand-all">Expand Default</button>
                        </div>
                    </article>
                </div>
            </div>
        </main>
        <script type="module" src="./register.mjs"></script>
        <script type="module">
            const sample = {
                app: {
                    name: "js-juice",
                    version: "1.0.0",
                    features: ["scroll", "keyboard", "lists"]
                },
                ui: {
                    theme: "light",
                    spacing: { sm: 8, md: 12, lg: 20 }
                },
                flags: {
                    debug: false,
                    telemetry: true
                }
            };

            const tree = document.getElementById("config-tree");
            const collapse = document.getElementById("collapse-all");
            const expand = document.getElementById("expand-all");

            function mount(expanded) {
                if (expanded) {
                    tree.setAttribute("expanded", "");
                } else {
                    tree.removeAttribute("expanded");
                }
                tree.setData(sample);
            }

            collapse.addEventListener("click", () => mount(false));
            expand.addEventListener("click", () => mount(true));
            mount(false);
        </script>
        <script type="module" src="../../brand/templates/includes/include.mjs"></script>
    </body>

</html>
