<div class="controls-emitter" id="emitter-controls">
    <h4>Emitter</h4>
    <div class="flex-row">
        <div class="flex-static">
            <input-direction id="direction" inline label="Direction" default-x="1" default-y="0"
                default-z="0"></input-direction>
        </div>
        <div class="flex-grow padding:0o5">

            <div class="row nowrap cols:2 gap:0o5">
                <input-number id="emitter-spread" label="Spread (deg)" type="number" step="1" value="10"></input-number>
                <input-number id="emitter-pps" label="PPS" type="number" min="0" value="30" step="1"></input-number>
            </div>
            <div class="row nowrap cols:2 gap:0o5">
                <input-number id="emitter-size" label="Size" type="number" step="1" value="2"></input-number>
                <input-number id="emitter-life" label="Lifespan" type="number" step="0.25" value="2"></input-number>
            </div>
            <div class="row nowrap cols:2 gap:0o5">
                <input-number id="emitter-speed" label="Speed" type="number" step="0.5" value="90"></input-number>

                <input-number id="emitter-friction" label="Friction" type="number" step="0.01"
                    value="0.0"></input-number>
            </div>
            <div class="row nowrap cols:1 gap:0o5">
                <input-vector id="position" step="1" dimentions="3" label="Position" default-x="0" default-y="0"
                    default-z="0" normalize="false"></input-vector>
            </div>
            <div class="row nowrap cols:1 gap:0o5">
                <input-vector id="gravity" step="1" dimentions="3" label="Gravity" default-x="0" default-y="0"
                    default-z="0" normalize="false"></input-vector>
            </div>

        </div>
    </div>

    <div class="controls-row">
        <input-button id="emitter-toggle" type="button">Emitter: off</input-button>
        <input-number id="emitter-burst" label="Burst" type="number" min="0" value="50" step="1"></input-number>
        <input-button id="emitter-burst-btn" type="button">Fire Burst</input-button>
    </div>

    <!-- Theta/Phi removed: replaced by direction ball input-direction -->
    <div class="controls-row">
        <label for="emitter-mask-select">Mask</label>
        <select id="emitter-mask-select">
            <option value="">(none)</option>
        </select>
        <label for="emitter-randomize">Randomize</label>
        <input id="emitter-randomize" type="checkbox" />
    </div>


    <script>
        const spreadInput = document.getElementById("emitter-spread");
        console.dir(spreadInput);
        spreadInput.addEventListener("change", (e) => {
            consople.debug("spread input", e);
        });
    </script>
</div>
