<div class="controls-emitter" id="emitter-controls">
    <h4>Emitter</h4>
    <div class="controls-row">
        <button id="emitter-toggle" type="button">Emitter: off</button>
        <label for="emitter-pps">PPS</label>
        <input id="emitter-pps" type="number" min="0" value="30" />
        <label for="emitter-burst">Burst</label>
        <input id="emitter-burst" type="number" min="0" value="50" />
        <button id="emitter-burst-btn" type="button">Fire Burst</button>
    </div>
    <div class="controls-row">
        <label for="emitter-direction">Direction (deg)</label>
        <input id="emitter-direction" type="number" step="1" value="0" />
        <label for="emitter-spread">Spread (deg)</label>
        <input id="emitter-spread" type="number" step="1" value="20" />
    </div>
    <div class="controls-row">
        <label for="emitter-theta">Theta (deg)</label>
        <input id="emitter-theta" type="number" step="1" value="90" />
        <label for="emitter-phi">Phi (deg)</label>
        <input id="emitter-phi" type="number" step="1" value="0" />
    </div>
    <div class="controls-row">
        <label for="emitter-pos-x">Pos X</label>
        <input id="emitter-pos-x" type="number" step="0.01" value="150" />
        <label for="emitter-pos-y">Pos Y</label>
        <input id="emitter-pos-y" type="number" step="0.01" value="150" />
        <label for="emitter-pos-z">Pos Z</label>
        <input id="emitter-pos-z" type="number" step="0.01" value="0" />
    </div>
    <div class="controls-row">
        <label for="emitter-speed">Speed</label>
        <input id="emitter-speed" type="number" step="0.01" value="120" />
        <label for="emitter-size">Size</label>
        <input id="emitter-size" type="number" step="0.1" value="3" />
        <label for="emitter-life">Lifespan (s)</label>
        <input id="emitter-life" type="number" step="0.1" value="2" />
    </div>
    <div class="controls-row">
        <label for="emitter-mask-select">Mask</label>
        <select id="emitter-mask-select">
            <option value="">(none)</option>
        </select>
        <label for="emitter-randomize">Randomize</label>
        <input id="emitter-randomize" type="checkbox" />
    </div>
    <div class="controls-row">
        <label for="emitter-grav-x">Gravity X</label>
        <input id="emitter-grav-x" type="number" step="0.01" value="0" />
        <label for="emitter-grav-y">Gravity Y</label>
        <input id="emitter-grav-y" type="number" step="0.01" value="0.0" />
        <label for="emitter-grav-z">Gravity Z</label>
        <input id="emitter-grav-z" type="number" step="0.01" value="0" />
    </div>
    <div class="controls-row">
        <label for="emitter-friction">Friction</label>
        <input id="emitter-friction" type="number" step="0.01" value="0.0" />
    </div>
</div>
