<animation-stage id="stage" width="100%" height="100%" fps="60" background="transparent">
    <div class="timeline-panel">
        <h3>Timeline Example</h3>
        <div class="track"><div id="bar" class="bar"></div></div>
        <div class="readout">
            <div class="item">cycle: <span id="cycle">0.00</span> / 4.00s</div>
            <div class="item">fps: <span id="fps">0</span></div>
            <div class="item">frame: <span id="frame">0</span></div>
            <div class="item">state: <span id="state">paused</span></div>
        </div>
    </div>
</animation-stage>
