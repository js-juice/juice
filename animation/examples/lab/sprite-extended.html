<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Sprite Extended</title>
        <style>
            body {
                margin: 0;
                font: 14px/1.3 sans-serif;
                color: #12203a;
                padding: 12px;
            }

            .stage {
                min-height: 520px;
                border: 1px solid #d8e2f1;
                border-radius: 10px;
                display: grid;
                place-items: center;
                background: radial-gradient(circle at 20% 20%, #273b60 0%, #101a2b 100%);
                overflow: hidden;
            }

            .controls {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                align-items: center;
                margin-top: 10px;
            }

            button,
            input {
                font: inherit;
            }

            button {
                border: 1px solid #a9bbd6;
                border-radius: 8px;
                padding: 6px 10px;
                background: #fff;
                cursor: pointer;
            }

            .readout {
                margin-top: 10px;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 12px;
                background: #eff4fb;
                border-radius: 8px;
                padding: 7px 9px;
            }
        </style>
    </head>

    <body>
        <div class="stage">
            <rocket-sprite id="rocket"></rocket-sprite>
        </div>
        <div class="controls">
            <button id="play" type="button">Play</button>
            <button id="pause" type="button">Pause</button>
            <button id="left" type="button">Yaw -5</button>
            <button id="right" type="button">Yaw +5</button>
            <button id="reset" type="button">Reset</button>
            <label>speed <input id="speed" type="range" min="0.25" max="3" step="0.25" value="1" /></label>
        </div>
        <div class="readout">
            state: <span id="state">loading</span>, yaw: <span id="yaw">0</span>, frame: <span id="frame">0</span>
        </div>

        <script type="module" src="./sprite-extended.mjs"></script>
    </body>

</html>
