<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Sprite Playground</title>
        <style>
            body {
                margin: 0;
                font: 14px/1.3 sans-serif;
                color: #12203a;
                padding: 12px;
            }

            .wrap {
                display: grid;
                gap: 14px;
            }

            .stage {
                min-height: 520px;
                border: 1px solid #d8e2f1;
                border-radius: 10px;
                display: grid;
                place-items: center;
                background: radial-gradient(circle at 20% 20%, #273b60 0%, #101a2b 100%);
                overflow: hidden;
            }

            .section {
                display: grid;
                gap: 8px;
            }

            .controls {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                align-items: center;
            }

            button,
            input {
                font: inherit;
            }

            button {
                border: 1px solid #a9bbd6;
                border-radius: 8px;
                padding: 6px 10px;
                background: #fff;
                cursor: pointer;
            }

            .readout {
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 12px;
                background: #eff4fb;
                border-radius: 8px;
                padding: 7px 9px;
            }
        </style>
    </head>

    <body>
        <div class="wrap">
            <div class="section">
                <strong>Base animation-sprite</strong>
                <div class="stage">
                    <animation-sprite
                        id="base"
                        width="265"
                        height="600"
                        src="../assets/rocket-yaw-sheet-med.png"
                        frames="30"
                        frame="0"
                    ></animation-sprite>
                </div>
                <div class="controls">
                    <button id="base-play" type="button">Play</button>
                    <button id="base-pause" type="button">Pause</button>
                    <button id="base-step" type="button">Step</button>
                </div>
                <div class="readout">frame: <span id="base-frame">0</span></div>
            </div>

            <div class="section">
                <strong>Extended rocket-sprite</strong>
                <div class="stage">
                    <rocket-sprite id="rocket"></rocket-sprite>
                </div>
                <div class="controls">
                    <button id="rocket-play" type="button">Play</button>
                    <button id="rocket-pause" type="button">Pause</button>
                    <button id="rocket-left" type="button">Yaw -5</button>
                    <button id="rocket-right" type="button">Yaw +5</button>
                    <label>speed <input id="speed" type="range" min="0.25" max="3" step="0.25" value="1" /></label>
                </div>
                <div class="readout">
                    yaw: <span id="rocket-yaw">0</span>, frame: <span id="rocket-frame">0</span>
                </div>
            </div>
        </div>

        <script type="module" src="./sprite.mjs"></script>
    </body>

</html>
