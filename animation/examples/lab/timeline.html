<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Timeline Example</title>
        <style>
            body {
                margin: 0;
                padding: 12px;
                font: 14px/1.3 sans-serif;
                color: #12203a;
            }

            .track {
                width: 100%;
                height: 16px;
                border-radius: 99px;
                background: #d7deec;
                overflow: hidden;
                margin: 8px 0 10px;
            }

            .bar {
                width: 0%;
                height: 100%;
                background: linear-gradient(90deg, #2f7cff, #1db4ff);
            }

            .controls {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                margin-bottom: 8px;
            }

            button {
                border: 1px solid #a9bbd6;
                border-radius: 8px;
                padding: 6px 10px;
                background: #fff;
                cursor: pointer;
                font: inherit;
            }

            .readout {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 6px;
            }

            .item {
                background: #eff4fb;
                border-radius: 8px;
                padding: 6px 8px;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 12px;
            }
        </style>
    </head>

    <body>
        <h3>Timeline Example</h3>
        <div class="track"><div id="bar" class="bar"></div></div>
        <div class="controls">
            <button id="play" type="button">Play</button>
            <button id="pause" type="button">Pause</button>
            <button id="reset" type="button">Reset</button>
            <button id="reverse" type="button">Reverse</button>
        </div>
        <div class="controls">
            <button class="speed" data-speed="0.5" type="button">0.5x</button>
            <button class="speed" data-speed="1" type="button">1x</button>
            <button class="speed" data-speed="2" type="button">2x</button>
            <button class="speed" data-speed="4" type="button">4x</button>
        </div>
        <div class="readout">
            <div class="item">cycle: <span id="cycle">0.00</span> / 4.00s</div>
            <div class="item">fps: <span id="fps">0</span></div>
            <div class="item">frame: <span id="frame">0</span></div>
            <div class="item">state: <span id="state">paused</span></div>
        </div>
        <script type="module" src="./timeline.mjs"></script>
    </body>

</html>
