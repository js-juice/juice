<!doctype html>
<html lang="en">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Body Example</title>
        <style>
            body {
                margin: 0;
                padding: 12px;
                font: 14px/1.3 sans-serif;
                color: #12203a;
            }

            .stage {
                position: relative;
                width: 100%;
                min-height: 360px;
                border-radius: 12px;
                overflow: hidden;
                background: radial-gradient(circle at 20% 20%, #2b4d73 0%, #18293e 55%, #0c1624 100%);
            }

            .body-box {
                width: 100%;
                height: 100%;
                border-radius: 14px;
                background: linear-gradient(160deg, #2ad7ff 0%, #1f8dff 45%, #0059d8 100%);
                border: 1px solid rgba(255, 255, 255, 0.35);
                box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
            }

            .readout {
                margin-top: 10px;
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 12px;
            }

            .item {
                background: #eff4fb;
                border-radius: 8px;
                padding: 6px 8px;
            }
        </style>
    </head>

    <body>
        <div class="stage" id="stage">
            <animation-body id="body" debug anchor="center center">
                <div class="body-box"></div>
            </animation-body>
        </div>
        <div class="readout">
            <div class="item">x: <span id="x">0</span></div>
            <div class="item">y: <span id="y">0</span></div>
            <div class="item">rotation: <span id="r">0</span></div>
        </div>
        <script type="module" src="./body.mjs"></script>
    </body>

</html>
